<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG · Administración de Puestos</title>
<style>
  :root{ --dark:#145A32; --green:#1E7145; --light:#D5F5E3; --bg:#f2f4f3; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1b2b24}
  header{background:var(--dark);color:#fff;padding:14px 16px;font-weight:700}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:17px;color:var(--dark)}
  label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}
  input{width:100%;border:1.5px solid #cfd8d3;border-radius:9px;padding:11px;font-size:15px}
  .row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  .btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;color:#fff;background:var(--green);cursor:pointer}
  .btn.sec{background:#5b6b63}
  .btn.del{background:#B03A2E;padding:7px 11px;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eee;vertical-align:top}
  th{color:var(--dark);font-size:12px;text-transform:uppercase}
  .url{font-family:monospace;font-size:12px;background:#f4f7f5;padding:6px 8px;border-radius:6px;word-break:break-all;border:1px solid #e3ebe6}
  .msg{padding:10px;border-radius:8px;margin-top:10px;font-weight:600;font-size:13px;display:none}
  .msg.ok{background:var(--light);color:var(--dark);display:block}
  .msg.err{background:#fdecea;color:#922;display:block}
  .small{font-size:12px;color:#5b6b63}
</style>
</head>
<body>
<header>SG · Administración de Puestos</header>
<div class="wrap">

  <div class="card">
    <h2>Configuración</h2>
    <label>URL base de la app (dominio donde está index.html)</label>
    <input id="base" placeholder="https://tu-usuario.github.io/tu-repo">
    <label>Clave de administrador</label>
    <input id="clave" type="password" placeholder="TOKEN_ADMIN">
    <button class="btn" style="margin-top:12px" onclick="cargar()">Conectar</button>
    <div id="msgCfg" class="msg"></div>
  </div>

  <div class="card" id="cardAdd" style="display:none">
    <h2>Agregar puesto</h2>
    <div class="row">
      <div><label>Objetivo</label><input id="objetivo" placeholder="Ej: PLANTA NORTE"></div>
      <div><label>Puesto</label><input id="puesto" placeholder="Ej: PORTON 1"></div>
      <button class="btn" onclick="agregar()">Agregar</button>
    </div>
    <div id="msgAdd" class="msg"></div>
  </div>

  <div class="card" id="cardList" style="display:none">
    <h2>Puestos configurados</h2>
    <p class="small">Cada URL abre la app ya fijada en ese objetivo y puesto. Copiala y usala en el dispositivo/Miradore.</p>
    <table id="tabla"><thead>
      <tr><th>Objetivo</th><th>Puesto</th><th>URL</th><th></th></tr>
    </thead><tbody></tbody></table>
  </div>

</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbym_DLVDCc3QRTNH4ux14KnARkMB9pHwDjI788BhoYQvrlhZwE8fy7WISmqRB9sDr0q/exec';  // termina en /exec
var CLAVE = '', BASE = '';

function msg(id,t,c){ var m=document.getElementById(id); m.textContent=t; m.className='msg '+c; }

async function cargar(){
  BASE = document.getElementById('base').value.trim().replace(/\/+$/,'');
  CLAVE = document.getElementById('clave').value.trim();
  if(!BASE){ return msg('msgCfg','Cargá la URL base','err'); }
  if(!CLAVE){ return msg('msgCfg','Cargá la clave de administrador','err'); }
  try{
    var r = await fetch(GAS_URL+'?action=listarConfig&token='+encodeURIComponent(CLAVE), {redirect:'follow'});
    var d = await r.json();
    if(!d.ok){ return msg('msgCfg','Error: '+(d.error||'sin autorizar'),'err'); }
    msg('msgCfg','Conectado ✓','ok');
    document.getElementById('cardAdd').style.display='block';
    document.getElementById('cardList').style.display='block';
    render(d.items||[]);
  }catch(e){ msg('msgCfg','Sin conexión con el backend','err'); }
}

async function agregar(){
  var o=document.getElementById('objetivo').value.trim();
  var p=document.getElementById('puesto').value.trim();
  if(!o||!p){ return msg('msgAdd','Completá objetivo y puesto','err'); }
  try{
    var r=await fetch(GAS_URL+'?action=guardarPuesto&token='+encodeURIComponent(CLAVE)+
      '&objetivo='+encodeURIComponent(o)+'&puesto='+encodeURIComponent(p), {redirect:'follow'});
    var d=await r.json();
    if(!d.ok){ return msg('msgAdd','Error: '+(d.error||''),'err'); }
    msg('msgAdd', d.duplicado?'Ese puesto ya existía':'Agregado ✓','ok');
    document.getElementById('objetivo').value=''; document.getElementById('puesto').value='';
    cargar();
  }catch(e){ msg('msgAdd','Sin conexión','err'); }
}

async function eliminar(o,p){
  if(!confirm('¿Eliminar "'+o+' · '+p+'"?')) return;
  try{
    await fetch(GAS_URL+'?action=eliminarPuesto&token='+encodeURIComponent(CLAVE)+
      '&objetivo='+encodeURIComponent(o)+'&puesto='+encodeURIComponent(p), {redirect:'follow'});
    cargar();
  }catch(e){ alert('Sin conexión'); }
}

function urlDe(o,p){
  return BASE+'/?objetivo='+encodeURIComponent(o)+'&puesto='+encodeURIComponent(p);
}

function render(items){
  var tb=document.querySelector('#tabla tbody'); tb.innerHTML='';
  if(!items.length){ tb.innerHTML='<tr><td colspan="4" class="small">Todavía no hay puestos.</td></tr>'; return; }
  items.forEach(function(it){
    var u=urlDe(it.objetivo,it.puesto);
    var tr=document.createElement('tr');
    tr.innerHTML =
      '<td>'+esc(it.objetivo)+'</td>'+
      '<td>'+esc(it.puesto)+'</td>'+
      '<td><div class="url">'+esc(u)+'</div>'+
        '<button class="btn sec" style="margin-top:6px;font-size:12px;padding:6px 10px" '+
        'onclick="copiar(\''+u.replace(/'/g,"\\'")+'\')">Copiar</button></td>'+
      '<td><button class="btn del" onclick="eliminar(\''+esc(it.objetivo).replace(/'/g,"\\'")+'\',\''+esc(it.puesto).replace(/'/g,"\\'")+'\')">Eliminar</button></td>';
    tb.appendChild(tr);
  });
}

function copiar(t){ navigator.clipboard.writeText(t).then(function(){ alert('URL copiada'); }); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
</script>
</body>
</html>
