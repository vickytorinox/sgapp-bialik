<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG · Reportes de Visitas y Proveedores</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
  :root{ --black:#0a0a0a; --accent:#1db954; --accent-dark:#158a3e; --light:#f0faf4; --border:#dfeee6; --bg:#eef2f0; --text:#0f1f16; --no:#e63030; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--black);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
  header .l{display:flex;align-items:center;gap:12px}
  header .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--accent)}
  header .t{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
  header .who{font-size:12px;opacity:.85}
  .wrap{max-width:1140px;margin:0 auto;padding:18px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
  h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:22px;margin:0 0 14px;color:var(--accent-dark)}
  label{display:block;font-weight:600;font-size:11px;margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px;color:#5a7a68}
  input,select{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:11px;font-size:14px;background:#fff;font-family:'DM Sans',sans-serif}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif}
  .btn:hover{background:var(--accent-dark)} .btn.sec{background:#5a7a68}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
  th{position:sticky;top:0;background:var(--black);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:1px}
  tr:nth-child(even) td{background:#fafcfb}
  .tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
  .ing{background:var(--accent)} .egr{background:var(--no)}
  .scroll{overflow:auto;max-height:65vh;border:1px solid #eee;border-radius:10px}
  .msg{padding:10px;border-radius:8px;margin-top:10px;font-weight:600;font-size:13px;display:none}
  .msg.ok{background:var(--light);color:var(--accent-dark);display:block} .msg.err{background:#fdecea;color:#922;display:block}
  .total{font-weight:700;color:var(--accent-dark);margin:10px 0}
  .small{font-size:12px;color:#5a7a68}
  @media print{ header,.filtros,.btns,.noprint{display:none!important} .scroll{max-height:none;border:0} body{background:#fff} }
</style>
</head>
<body>
<header>
  <div class="l"><span class="logo">SG</span><span class="t">Reportes</span></div>
  <span class="who" id="hWho"></span>
</header>
<div class="wrap">

  <div class="card" id="cardLogin">
    <h2>Acceso</h2>
    <label>Usuario</label>
    <input id="usuario" placeholder="Usuario (dejalo vacío si usás la clave maestra)" autocomplete="username">
    <label>Contraseña</label>
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" style="margin-top:12px" onclick="entrar()">Entrar</button>
    <div id="msgLogin" class="msg"></div>
    <p class="small" style="margin-top:12px">Empresa: dejá el usuario vacío y poné la clave de administrador para ver todo.</p>
  </div>

  <div class="card filtros" id="cardFiltros" style="display:none">
    <h2>Filtros</h2>
    <div class="grid">
      <div><label>Desde</label><input id="desde" type="date"></div>
      <div><label>Hasta</label><input id="hasta" type="date"></div>
      <div><label>Objetivo</label><input id="objetivo" placeholder="Todos" list="listaObjetivos"><datalist id="listaObjetivos"></datalist></div>
      <div><label>Puesto</label><input id="puesto" placeholder="Todos"></div>
      <div><label>Movimiento</label><select id="tipo"><option value="">Todos</option><option>INGRESO</option><option>EGRESO</option></select></div>
      <div><label>Tipo persona</label><select id="categoria"><option value="">Todas</option><option>PROVEEDOR</option><option>VISITA</option></select></div>
      <div><label>Nombre</label><input id="nombre" placeholder="Contiene..."></div>
      <div><label>Patente</label><input id="patente" placeholder="Contiene..."></div>
      <div><label>CUIL vigilador</label><input id="cuil" placeholder="Contiene..."></div>
    </div>
    <div class="btns">
      <button class="btn" onclick="consultar()">Consultar</button>
      <button class="btn sec" onclick="limpiar()">Limpiar</button>
      <button class="btn sec" onclick="exportCSV()">Descargar CSV</button>
      <button class="btn sec" onclick="window.print()">Imprimir / PDF</button>
    </div>
    <div id="msgF" class="msg"></div>
  </div>

  <div class="card" id="cardTabla" style="display:none">
    <div class="total" id="total"></div>
    <div class="scroll">
      <table id="tabla"><thead><tr>
        <th>Fecha</th><th>Hora</th><th>Mov.</th><th>Tipo</th><th>Nombre</th>
        <th>Veh.</th><th>Patente</th><th>Objetivo</th><th>Puesto</th><th>Obs.</th><th>CUIL</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

</div>

<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbym_DLVDCc3QRTNH4ux14KnARkMB9pHwDjI788BhoYQvrlhZwE8fy7WISmqRB9sDr0q/exec';
var AUTH={ mode:null, token:'', sesion:'', objetivos:'*' };
var DATA=[];

function msg(id,t,c){ var m=document.getElementById(id); m.textContent=t; m.className='msg '+c; }
function val(id){ return document.getElementById(id).value.trim(); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return String(n).padStart(2,'0'); }
function e(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function entrar(){
  var usuario=val('usuario'), clave=document.getElementById('clave').value;
  if(!clave) return msg('msgLogin','Ingresá la contraseña','err');
  try{
    if(!usuario){
      // clave maestra (empresa)
      var r=await fetch(GAS_URL+'?action=consultar&token='+encodeURIComponent(clave)+'&desde='+hoy()+'&hasta='+hoy(),{redirect:'follow'});
      var d=await r.json();
      if(!d.ok) return msg('msgLogin','Clave incorrecta','err');
      AUTH={mode:'admin', token:clave, sesion:'', objetivos:'*'};
      document.getElementById('hWho').textContent='Empresa (acceso total)';
    } else {
      var r2=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'login',usuario,clave}),redirect:'follow'});
      var d2=await r2.json();
      if(!d2.ok) return msg('msgLogin','Usuario o contraseña incorrectos','err');
      AUTH={mode:'user', token:'', sesion:d2.sesion, objetivos:d2.objetivos};
      document.getElementById('hWho').textContent=(d2.nombre||d2.usuario)+' · '+(d2.objetivos==='*'?'todos':d2.objetivos.join(', '));
    }
    iniciarPortal();
  }catch(err){ msg('msgLogin','Sin conexión con el backend','err'); }
}

function iniciarPortal(){
  document.getElementById('cardLogin').style.display='none';
  document.getElementById('cardFiltros').style.display='block';
  document.getElementById('cardTabla').style.display='block';
  document.getElementById('desde').value=hoy(); document.getElementById('hasta').value=hoy();
  // limitar objetivos si el usuario tiene restricción
  var dl=document.getElementById('listaObjetivos');
  if(AUTH.objetivos!=='*'){ dl.innerHTML=AUTH.objetivos.map(o=>'<option value="'+e(o)+'">').join(''); }
  consultar();
}

async function consultar(){
  var base={ action:'consultar', desde:val('desde'), hasta:val('hasta'), objetivo:val('objetivo'),
    puesto:val('puesto'), tipo:val('tipo'), categoria:val('categoria'), nombre:val('nombre'), patente:val('patente'), cuil:val('cuil') };
  if(AUTH.mode==='admin') base.token=AUTH.token; else base.sesion=AUTH.sesion;
  try{
    var r=await fetch(GAS_URL+'?'+new URLSearchParams(base).toString(),{redirect:'follow'});
    var d=await r.json();
    if(!d.ok){
      if(d.expirado){ alert('La sesión expiró. Entrá de nuevo.'); location.reload(); return; }
      return msg('msgF','Error: '+(d.error||''),'err');
    }
    document.getElementById('msgF').className='msg';
    pintar(d.rows||[]);
  }catch(err){ msg('msgF','Sin conexión','err'); }
}

function pintar(rows){
  DATA=rows;
  document.getElementById('total').textContent='Total: '+rows.length+' registros';
  var tb=document.querySelector('#tabla tbody'); tb.innerHTML='';
  rows.forEach(function(x){
    var tag=(String(x.tipo).toUpperCase()==='INGRESO')?'ing':'egr', tr=document.createElement('tr');
    tr.innerHTML='<td>'+e(x.fecha)+'</td><td>'+e(x.hora)+'</td><td><span class="tag '+tag+'">'+e(x.tipo)+'</span></td>'+
      '<td>'+e(x.categoria)+'</td><td>'+e(x.nombre)+'</td><td>'+e(x.vehiculo)+'</td><td>'+e(x.patente)+'</td>'+
      '<td>'+e(x.objetivo)+'</td><td>'+e(x.puesto)+'</td><td>'+e(x.observaciones)+'</td><td>'+e(x.cuil)+'</td>';
    tb.appendChild(tr);
  });
}

function exportCSV(){
  if(!DATA.length) return alert('No hay datos para exportar');
  var head=['Fecha','Hora','Movimiento','TipoPersona','Nombre','Vehiculo','Patente','Objetivo','Puesto','Observaciones','CUIL'];
  var lines=[head.join(';')];
  DATA.forEach(function(x){ lines.push([x.fecha,x.hora,x.tipo,x.categoria,x.nombre,x.vehiculo,x.patente,x.objetivo,x.puesto,x.observaciones,x.cuil]
    .map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(';')); });
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='reporte_visitas_'+hoy()+'.csv'; a.click();
}
function limpiar(){ ['objetivo','puesto','nombre','patente','cuil'].forEach(id=>document.getElementById(id).value=''); document.getElementById('tipo').value=''; document.getElementById('categoria').value=''; }
</script>
</body>
</html>
