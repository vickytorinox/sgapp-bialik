<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG · Reportes de Visitas y Proveedores</title>
<style>
  :root{ --dark:#145A32; --green:#1E7145; --light:#D5F5E3; --bg:#f2f4f3; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1b2b24}
  header{background:var(--dark);color:#fff;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:17px;color:var(--dark)}
  label{display:block;font-weight:600;font-size:12px;margin:8px 0 4px}
  input,select{width:100%;border:1.5px solid #cfd8d3;border-radius:9px;padding:10px;font-size:14px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;color:#fff;background:var(--green);cursor:pointer}
  .btn.sec{background:#5b6b63}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
  th{position:sticky;top:0;background:var(--dark);color:#fff;font-size:11px;text-transform:uppercase}
  tr:nth-child(even) td{background:#fafcfb}
  .tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
  .ing{background:var(--green)} .egr{background:#B03A2E}
  .scroll{overflow:auto;max-height:65vh;border:1px solid #eee;border-radius:10px}
  .msg{padding:10px;border-radius:8px;margin-top:10px;font-weight:600;font-size:13px;display:none}
  .msg.ok{background:var(--light);color:var(--dark);display:block}
  .msg.err{background:#fdecea;color:#922;display:block}
  .total{font-weight:700;color:var(--dark);margin:10px 0}
  @media print{ header,.filtros,.btns,.noprint{display:none!important} .scroll{max-height:none;border:0} body{background:#fff} }
</style>
</head>
<body>
<header>
  <span>SG · Reportes</span>
  <span id="hCtx" style="font-size:12px;opacity:.85"></span>
</header>
<div class="wrap">

  <div class="card" id="cardLogin">
    <h2>Acceso</h2>
    <label>Clave de administrador</label>
    <input id="clave" type="password" placeholder="TOKEN_ADMIN">
    <button class="btn" style="margin-top:12px" onclick="conectar()">Entrar</button>
    <div id="msgLogin" class="msg"></div>
  </div>

  <div class="card filtros" id="cardFiltros" style="display:none">
    <h2>Filtros</h2>
    <div class="grid">
      <div><label>Desde</label><input id="desde" type="date"></div>
      <div><label>Hasta</label><input id="hasta" type="date"></div>
      <div><label>Objetivo</label><input id="objetivo" placeholder="Todos"></div>
      <div><label>Puesto</label><input id="puesto" placeholder="Todos"></div>
      <div><label>Movimiento</label>
        <select id="tipo"><option value="">Todos</option><option>INGRESO</option><option>EGRESO</option></select></div>
      <div><label>Tipo persona</label>
        <select id="categoria"><option value="">Todas</option><option>PROVEEDOR</option><option>VISITA</option></select></div>
      <div><label>Nombre</label><input id="nombre" placeholder="Contiene..."></div>
      <div><label>Patente</label><input id="patente" placeholder="Contiene..."></div>
      <div><label>CUIL vigilador</label><input id="cuil" placeholder="Contiene..."></div>
    </div>
    <div class="btns">
      <button class="btn" onclick="consultar()">Consultar</button>
      <button class="btn sec" onclick="limpiar()">Limpiar</button>
      <button class="btn sec" onclick="exportCSV()">Descargar CSV</button>
      <button class="btn sec" onclick="window.print()">Imprimir / PDF</button>
    </div>
    <div id="msgF" class="msg"></div>
  </div>

  <div class="card" id="cardTabla" style="display:none">
    <div class="total" id="total"></div>
    <div class="scroll">
      <table id="tabla"><thead><tr>
        <th>Fecha</th><th>Hora</th><th>Mov.</th><th>Tipo</th><th>Nombre</th>
        <th>Veh.</th><th>Patente</th><th>Objetivo</th><th>Puesto</th><th>Obs.</th><th>CUIL</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

</div>

<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbym_DLVDCc3QRTNH4ux14KnARkMB9pHwDjI788BhoYQvrlhZwE8fy7WISmqRB9sDr0q/exec';  // termina en /exec
var CLAVE='', DATA=[];

function msg(id,t,c){ var m=document.getElementById(id); m.textContent=t; m.className='msg '+c; }

async function conectar(){
  CLAVE=document.getElementById('clave').value.trim();
  if(!CLAVE) return msg('msgLogin','Ingresá la clave','err');
  try{
    var r=await fetch(GAS_URL+'?action=consultar&token='+encodeURIComponent(CLAVE)+'&desde='+hoy()+'&hasta='+hoy(),{redirect:'follow'});
    var d=await r.json();
    if(!d.ok) return msg('msgLogin','Error: '+(d.error||'sin autorizar'),'err');
    document.getElementById('cardLogin').style.display='none';
    document.getElementById('cardFiltros').style.display='block';
    document.getElementById('cardTabla').style.display='block';
    document.getElementById('desde').value=hoy(); document.getElementById('hasta').value=hoy();
    pintar(d.rows||[]);
  }catch(e){ msg('msgLogin','Sin conexión con el backend','err'); }
}

async function consultar(){
  var qs=new URLSearchParams({action:'consultar',token:CLAVE,
    desde:val('desde'),hasta:val('hasta'),objetivo:val('objetivo'),puesto:val('puesto'),
    tipo:val('tipo'),categoria:val('categoria'),nombre:val('nombre'),patente:val('patente'),cuil:val('cuil')});
  try{
    var r=await fetch(GAS_URL+'?'+qs.toString(),{redirect:'follow'});
    var d=await r.json();
    if(!d.ok) return msg('msgF','Error: '+(d.error||''),'err');
    msg('msgF','','ok'); document.getElementById('msgF').className='msg';
    pintar(d.rows||[]);
  }catch(e){ msg('msgF','Sin conexión','err'); }
}

function pintar(rows){
  DATA=rows;
  document.getElementById('total').textContent='Total: '+rows.length+' registros';
  var tb=document.querySelector('#tabla tbody'); tb.innerHTML='';
  rows.forEach(function(x){
    var tr=document.createElement('tr');
    var tag=(String(x.tipo).toUpperCase()==='INGRESO')?'ing':'egr';
    tr.innerHTML='<td>'+e(x.fecha)+'</td><td>'+e(x.hora)+'</td>'+
      '<td><span class="tag '+tag+'">'+e(x.tipo)+'</span></td>'+
      '<td>'+e(x.categoria)+'</td><td>'+e(x.nombre)+'</td>'+
      '<td>'+e(x.vehiculo)+'</td><td>'+e(x.patente)+'</td>'+
      '<td>'+e(x.objetivo)+'</td><td>'+e(x.puesto)+'</td>'+
      '<td>'+e(x.observaciones)+'</td><td>'+e(x.cuil)+'</td>';
    tb.appendChild(tr);
  });
}

function exportCSV(){
  if(!DATA.length) return alert('No hay datos para exportar');
  var head=['Fecha','Hora','Movimiento','TipoPersona','Nombre','Vehiculo','Patente','Objetivo','Puesto','Observaciones','CUIL'];
  var lines=[head.join(';')];
  DATA.forEach(function(x){
    lines.push([x.fecha,x.hora,x.tipo,x.categoria,x.nombre,x.vehiculo,x.patente,x.objetivo,x.puesto,x.observaciones,x.cuil]
      .map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(';'));
  });
  var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='reporte_visitas_'+hoy()+'.csv'; a.click();
}

function limpiar(){ ['objetivo','puesto','nombre','patente','cuil'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('tipo').value=''; document.getElementById('categoria').value=''; }
function val(id){ return document.getElementById(id).value.trim(); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return String(n).padStart(2,'0'); }
function e(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
</script>
</body>
</html>
